[package]
name = "bria-rmbg-worker"
version = "1.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
photocraft-plugin-api = { path = "../vendor/plugin-api", version = "0.1.0" }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
